name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            if [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              echo "No previous commit to compare with, building."
              echo "backend=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RANGE="$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA"
          fi
          CHANGED="$(git diff --name-only "$RANGE")"
          echo "Changed files:"
          echo "$CHANGED"
          if grep -qE '^(backend/|\.github/workflows/backend-ci\.yml$)' <<< "$CHANGED"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Placeholders required by application.yml; tests use a Testcontainers database.
      POSTGRES_DB: travel_api
      POSTGRES_USER: travel_api
      POSTGRES_PASSWORD: ci_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and test
        run: ./gradlew build

  backend-ci:
    # Required status check: always runs, green when the build passed or was not needed.
    name: Backend CI
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES_RESULT, build: $BUILD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then exit 1; fi
          if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != "skipped" ]; then exit 1; fi
