spring:
  application:
    name: travel-api
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
