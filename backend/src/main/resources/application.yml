spring:
  application:
    name: travel-api
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 4s

app:
  jwt:
    # Required, at least 32 bytes. Set JWT_SECRET in .env (see .env.example); never commit a real secret.
    secret: ${JWT_SECRET:}
    # How long an access token is valid, e.g. 30m, 24h, 7d.
    expiration: ${JWT_EXPIRATION:24h}
  geocoding:
    base-url: https://nominatim.openstreetmap.org
    user-agent: "TravelApi/1.0 (+https://github.com/TravelApp-Team-2026/travel-api)"
    # Nominatim allows at most 1 request per second; a small margin is added.
    min-request-interval: 1100ms
    # How long a search may wait for its turn before it is rejected with 503.
    max-queue-wait: 2s
    cache-ttl: 24h
    cache-max-entries: 1000
    result-limit: 5
  routing:
    osrm:
      # Public OSRM demo server (non-commercial use). Set OSRM_BASE_URL to use another server.
      base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
      user-agent: "TravelApi/1.0 (+https://github.com/TravelApp-Team-2026/travel-api)"
      # The demo server allows at most 1 request per second; a small margin is added.
      min-request-interval: 1100ms
      # How long a request may wait for its turn before the leg becomes a straight line.
      max-queue-wait: 5s
      # A stop farther than this from the nearest road counts as "no route".
      max-snap-distance-meters: 10000
